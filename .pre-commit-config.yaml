fail_fast: false

# Priority 0: Read-only hooks; trailing whitespace
# Priority 1: end-of-file-fixer
# Priority 2: Ruff linter
# Priority 3: zizmor, Ruff formatter

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        priority: 0
      - id: end-of-file-fixer
        priority: 1
      - id: check-yaml
        priority: 0
      - id: check-toml
        priority: 0
      - id: check-merge-conflict
        priority: 0
      - id: check-case-conflict
        priority: 0
      - id: name-tests-test
        priority: 0
        args: [--pytest-test-first]

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 17e12779811926f000bdfa1795f9e3735dd71ac3 # frozen: 0.26
    hooks:
      - id: validate-pyproject
        priority: 0

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # frozen: v1.30.1
    hooks:
      - id: zizmor
        args: [--fix=safe]
        priority: 3

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 12e63946db2c5cfcc9030fac21c3883ba88c6ed8 # frozen: 0.38.0
    hooks:
      - id: check-renovate
        language: python # means renovate will update the `additional_dependencies` for the hook
        additional_dependencies:
          - "json5"
        priority: 0
      - id: check-github-workflows
        priority: 0

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
        priority: 0

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 44b5042edab9382aba712eed4f9c7bab7a3d6a3e # frozen: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
        require_serial: true
        priority: 2
      - id: ruff-format
        priority: 3

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: a1785f8e81fe9936d828bef574e6db07e8c8c374 # frozen: 0.12.23
    hooks:
      - id: uv-lock
        priority: 0
        args: [--default-index=https://pypi.org/simple, --refresh, --check]
