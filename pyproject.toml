[project]
name = "ecosystem-analyzer"
version = "0.1.0"
description = "A tool for analyzing Python projects with ty"
dependencies = [
    "mypy-primer @ git+https://github.com/hauntsaninja/mypy_primer@e1f6fe93da5de0cbaf0ab00341d05968a0331fae",
    "click==8.5.0",
    "jinja2==3.1.6",
    "typing-extensions>=4.16.0",
]
requires-python = ">=3.13"

[project.scripts]
ecosystem-analyzer = "ecosystem_analyzer.main:cli"

[build-system]
requires = ["uv_build>=0.7.13"]
build-backend = "uv_build"

[tool.ruff.lint]
preview = true

extend-select = [
    "ANN",
    "ARG",
    "B",
    "D",
    "E",
    "EXE",
    "F",
    "I",
    "ISC",
    "PGH",
    "PYI",
    "PT",
    "RUF",
    "SIM",
    "UP",
    "read-whole-file",
    "write-whole-file",
]

ignore = [
    # Unnecessarily strict/pedantic
    "undocumented-public-init",
    "blank-line-after-function",
    # These are all enforced by, or incompatible with, the ruff formatter:
    "whitespace-before-punctuation",
    "line-too-long",
    "trailing-whitespace",
    "blank-line-with-whitespace",
    # It's often necessary to compare types instead of using isinstance()
    "type-comparison",
    "collection-literal-concatenation",
    # annoying false positives in this repo
    "ambiguous-unicode-character-string",
]

unfixable = [
    # ruff keeps the call, but mostly we want to get rid of it all
    "unused-variable",
    # automatic fix might obscure issue
    "multi-value-repeated-key-literal",
    # automatic fix might obscure issue
    "multi-value-repeated-key-variable",
    # automatic fix might obscure issue
    "useless-expression",
    # automatic fix might obscure issue
    "subprocess-run-without-check",
    # Ruff's fix is faster, but I prefer using itertools.chain_from_iterable
    "quadratic-list-summation",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.format]
preview = true

[tool.ty.analysis]
return-type-inference = "always"
strict-literal-narrowing = true
strict-generic-narrowing = true

[tool.ty.rules]
blanket-ignore-comment = "error"
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"
unsupported-dynamic-base = "warn"

[tool.ty.src]
exclude = ["plots"]

[dependency-groups]
dev = ["pytest>=8.4.1", "ty==0.0.93"]
prek = ["prek"]

[tool.uv]
# Work around Renovate not enforcing its configured cooldown for lockfile-maintenance PRs:
# https://docs.renovatebot.com/presets-security/#securityminimumreleaseagepypi
# Enforce the same 30-day cooldown specified in our shared Renovate config:
# https://github.com/astral-sh/renovate-config/blob/0146d963693a5335c975355d8383fe6933f5dc95/preset.json5#L46
exclude-newer = "P30D"
# Exempt the Astral tools pinned in this project.
exclude-newer-package = { ty = false, uv-build = false }
no-build = true
require-build-hashes = true
# The project is installed locally, and mypy-primer is pinned to Git.
no-binary-package = ["ecosystem-analyzer", "mypy-primer"]
# Pin the isolated build environment for source-build exceptions.
