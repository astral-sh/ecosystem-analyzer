[project]
name = "ecosystem-analyzer"
version = "0.1.0"
description = "A tool for analyzing Python projects with ty"
dependencies = [
    "gitpython==3.1.57",
    "mypy-primer @ git+https://github.com/hauntsaninja/mypy_primer@db37f8a384c45c02fc52544fd819f979d66e174a",
    "click==8.4.2",
    "jinja2==3.1.6",
    "typing-extensions>=4.16.0",
]
requires-python = ">=3.13"

[project.scripts]
ecosystem-analyzer = "ecosystem_analyzer.main:cli"

[build-system]
requires = ["uv_build>=0.7.13"]
build-backend = "uv_build"

[tool.ruff.lint]
preview = true

extend-select = [
    "ANN",
    "ARG",
    "B",
    "D",
    "E",
    "EXE",
    "F",
    "I",
    "ISC",
    "PGH",
    "PYI",
    "PT",
    "RUF",
    "SIM",
    "UP",
    "read-whole-file",
    "write-whole-file",
]

ignore = [
    # Unnecessarily strict/pedantic
    "undocumented-public-init",
    "blank-line-after-function",
    # These are all enforced by, or incompatible with, the ruff formatter:
    "whitespace-before-punctuation",
    "line-too-long",
    "trailing-whitespace",
    "blank-line-with-whitespace",
    # It's often necessary to compare types instead of using isinstance()
    "type-comparison",
    "collection-literal-concatenation",
    # annoying false positives in this repo
    "ambiguous-unicode-character-string",
]

unfixable = [
    # ruff keeps the call, but mostly we want to get rid of it all
    "unused-variable",
    # automatic fix might obscure issue
    "multi-value-repeated-key-literal",
    # automatic fix might obscure issue
    "multi-value-repeated-key-variable",
    # automatic fix might obscure issue
    "useless-expression",
    # automatic fix might obscure issue
    "subprocess-run-without-check",
    # Ruff's fix is faster, but I prefer using itertools.chain_from_iterable
    "quadratic-list-summation",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.format]
preview = true

[tool.ty.analysis]
strict-literal-narrowing = true

[tool.ty.rules]
blanket-ignore-comment = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsupported-dynamic-base = "warn"

[tool.ty.src]
exclude = ["plots"]

[dependency-groups]
dev = ["pytest>=8.4.1", "ty==0.0.72"]

[tool.uv]
no-build = true
# The project is installed locally, and mypy-primer is pinned to Git.
no-binary-package = ["ecosystem-analyzer", "mypy-primer"]
# Pin the isolated build environment for source-build exceptions.
build-constraint-dependencies = [
    "setuptools==84.0.0",
    "uv-build==0.12.3",
]
